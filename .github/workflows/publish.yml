name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, typecheck, and test
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Verify release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PKG_VERSION"

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published on npm — skipping publish."
            exit 0
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --provenance --access public
          else
            npm install -g npm@latest
            npm publish --provenance --access public
          fi
