  <rect x="64" y="176" width="480" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="64" y="192" width="440" height="8" rx="4" fill="#94A3B8"/>
  <rect x="64" y="208" width="360" height="8" rx="4" fill="#94A3B8"/>

  <!-- Composer footer buttons -->
  <rect x="64" y="229" width="68" height="18" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="76" y="235" width="44" height="6" rx="3" fill="#64748B"/>
  <rect x="524" y="226" width="56" height="24" rx="12" fill="#2563EB"/>
  <path d="M546 238L552 232L558 238M552 232V244" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
