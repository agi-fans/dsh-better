  <rect x="70" y="59" width="34" height="6" rx="3" fill="#EFF6FF"/>

  <!-- 6-cell progress meter (4 filled, 2 remaining) -->
  <rect x="124" y="56" width="11" height="11" rx="2.5" fill="#3B82F6"/>
  <rect x="139" y="56" width="11" height="11" rx="2.5" fill="#3B82F6"/>
  <rect x="154" y="56" width="11" height="11" rx="2.5" fill="#3B82F6"/>
  <rect x="169" y="56" width="11" height="11" rx="2.5" fill="#60A5FA"/>
  <rect x="184" y="56" width="11" height="11" rx="2.5" fill="#334155"/>
  <rect x="199" y="56" width="11" height="11" rx="2.5" fill="#334155"/>

