  <rect x="224" y="53" width="46" height="18" rx="9" fill="#28354E"/>
  <rect x="234" y="59" width="26" height="6" rx="3" fill="#94A3B8"/>

  <rect x="276" y="53" width="48" height="18" rx="9" fill="#28354E"/>
  <rect x="286" y="59" width="28" height="6" rx="3" fill="#94A3B8"/>

  <rect x="330" y="53" width="52" height="18" rx="9" fill="#1D4ED8" stroke="#60A5FA" stroke-width="1"/>
  <rect x="340" y="59" width="32" height="6" rx="3" fill="#F8FAFC"/>

  <rect x="388" y="53" width="50" height="18" rx="9" fill="#28354E"/>
  <rect x="398" y="59" width="30" height="6" rx="3" fill="#64748B"/>

  <!-- Elapsed clock + Cancel pill -->
  <rect x="490" y="56" width="34" height="12" rx="4" fill="#28354E"/>
  <rect x="496" y="59" width="22" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="532" y="52" width="50" height="20" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <rect x="541" y="59" width="32" height="6" rx="3" fill="#CBD5E1"/>

  <!-- Row 2: Tool activity chips -->
  <rect x="60" y="84" width="122" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="72" cy="95" r="3.5" fill="#22C55E"/>
  <rect x="82" y="92" width="88" height="6" rx="3" fill="#CBD5E1"/>

  <rect x="190" y="84" width="136" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="202" cy="95" r="3.5" fill="#22C55E"/>
  <rect x="212" y="92" width="102" height="6" rx="3" fill="#CBD5E1"/>

  <rect x="334" y="84" width="118" height="22" rx="11" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <circle cx="346" cy="95" r="3.5" fill="#60A5FA"/>
  <rect x="356" y="92" width="84" height="6" rx="3" fill="#E2E8F0"/>

  <!-- Composer Box below Dock -->
